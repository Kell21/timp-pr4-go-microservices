# Вариант пайплайна для GitLab CI + GitLab Container Registry (по методическим указаниям).
# Основной рабочий пайплайн проекта — .github/workflows/ci.yml (GitHub Actions + GHCR),
# стадии и инструменты в обоих файлах совпадают.
stages: [lint, test, build-images, scan, push]

variables:
  DOCKER_TLS_CERTDIR: ""
  API_IMAGE: $CI_REGISTRY_IMAGE/api:latest
  WEB_IMAGE: $CI_REGISTRY_IMAGE/web:latest

.docker:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

lint:
  stage: lint
  image: golangci/golangci-lint:v2.4.0
  script:
    - cd api && golangci-lint run --config ../.golangci.yml ./...
    - cd ../web && golangci-lint run --config ../.golangci.yml ./...

test:
  stage: test
  image: golang:1.25
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_USER: taskuser
    POSTGRES_PASSWORD: taskpass
    POSTGRES_DB: taskdb
    TEST_DB_DSN: postgres://taskuser:taskpass@postgres:5432/taskdb?sslmode=disable
  script:
    - cd api && go test -v -cover ./...
    - cd ../web && go test -v -cover ./...

build-images:
  stage: build-images
  extends: .docker
  script:
    - docker build -t "$API_IMAGE" ./api
    - docker build -t "$WEB_IMAGE" ./web
    - docker save "$API_IMAGE" -o api.tar
    - docker save "$WEB_IMAGE" -o web.tar
  artifacts:
    paths: [api.tar, web.tar]
    expire_in: 1 day

scan:
  stage: scan
  image: alpine:edge
  script:
    - apk add --no-cache trivy --repository=https://dl-cdn.alpinelinux.org/alpine/edge/community --repository=https://dl-cdn.alpinelinux.org/alpine/edge/testing
    - trivy image --input api.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
    - trivy image --input web.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

push:
  stage: push
  extends: .docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker load -i api.tar
    - docker load -i web.tar
    - docker push "$API_IMAGE"
    - docker push "$WEB_IMAGE"
